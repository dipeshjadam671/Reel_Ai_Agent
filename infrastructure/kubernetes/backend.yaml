apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: video-ai-platform
data:
  APP_ENV: "production"
  MOCK_EXTERNAL_APIS: "true"
  DEFAULT_LLM_PROVIDER: "openai"
  LLM_CHEAP_MODEL: "gpt-4o-mini"
  LLM_REASONING_MODEL: "gpt-4o"
  SEARCH_PROVIDER: "duckduckgo"
  TTS_PROVIDER: "elevenlabs"
  AVATAR_PROVIDER: "heygen"
  REDIS_URL: "redis://redis-service:6379/0"
  STORAGE_BACKEND: "local"
  LOCAL_STORAGE_PATH: "/tmp/video_ai_platform/storage"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-api
  namespace: video-ai-platform
  labels:
    app: backend-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-api
  template:
    metadata:
      labels:
        app: backend-api
    spec:
      containers:
        - name: api
          image: video-ai-platform/backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: backend-config
          env:
            - name: DATABASE_URL
              value: "postgresql+asyncpg://postgres:postgres@postgres-service:5432/video_ai_db"
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: jwt-secret
                  optional: true
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1.5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: video-ai-platform
spec:
  selector:
    app: backend-api
  ports:
    - port: 8000
      targetPort: 8000
